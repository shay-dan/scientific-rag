name: Cost-Aware Scientific RAG CI

on:
  push:
    paths:
      - "cost aware pipeline/**"
      - ".github/workflows/cost-aware-pipeline.yml"
  pull_request:
    paths:
      - "cost aware pipeline/**"
      - ".github/workflows/cost-aware-pipeline.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cost aware pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile application
        run: python -m compileall -q app src model_policy.py run_api.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

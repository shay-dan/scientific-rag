name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  source-and-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Audit Python dependencies
        working-directory: cost aware pipeline
        run: |
          python -m pip install pip-audit
          # Ragas 0.4.3 is the latest release. PYSEC-2026-3046 affects only its
          # unused multi-modal URL/file loader. This application calls only the
          # text Faithfulness, AnswerRelevancy, ContextPrecision and
          # ContextRecall metrics with persisted plain-text contexts.
          # PYSEC-2026-2447 is an unfixed pickle risk in Ragas' transitive
          # diskcache dependency. No Ragas/diskcache cache is configured, and
          # the container runs as a non-root user. Review both exceptions when
          # a fixed upstream release becomes available.
          pip-audit -r requirements.txt \
            --ignore-vuln PYSEC-2026-3046 \
            --ignore-vuln PYSEC-2026-2447
      - name: Scan current source for secrets and vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t scientific-rag-security:local "cost aware pipeline"
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scientific-rag-security:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

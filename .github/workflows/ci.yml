name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  legacy-unit-tests:
    name: Legacy application unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile application modules
        run: python -m compileall -q new_scientific_rag.py full_app.py src tests
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  production-image-tests:
    name: Production Docker image tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: scientific_rag
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: scientific_rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scientific_rag -d scientific_rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Build the production image
        run: docker build --tag scientific-rag-ci:local "cost aware pipeline"

      - name: Compile application and tests in the production image
        run: >-
          docker run --rm
          --env PYTHONPYCACHEPREFIX=/tmp/pycache
          --volume "$PWD/cost aware pipeline/tests:/app/tests:ro"
          scientific-rag-ci:local
          python -m compileall -q app src tests model_policy.py run_api.py

      - name: Run unit tests in the production image
        run: >-
          docker run --rm
          --volume "$PWD/cost aware pipeline/tests:/app/tests:ro"
          scientific-rag-ci:local
          python -m unittest discover -s tests -v

      - name: Apply and verify database migrations
        run: |
          docker run --rm --network host \
            --env DATABASE_URL=postgresql+asyncpg://scientific_rag:ci_test_only@127.0.0.1:5432/scientific_rag \
            scientific-rag-ci:local \
            alembic upgrade head
          docker run --rm --network host \
            --env DATABASE_URL=postgresql+asyncpg://scientific_rag:ci_test_only@127.0.0.1:5432/scientific_rag \
            scientific-rag-ci:local \
            alembic current --check-heads

      - name: Run PostgreSQL/pgvector and Redis integration tests
        run: >-
          docker run --rm --network host
          --env RUN_INTEGRATION_TESTS=1
          --env DATABASE_URL_TEST=postgresql://scientific_rag:ci_test_only@127.0.0.1:5432/scientific_rag
          --env REDIS_URL_TEST=redis://127.0.0.1:6379/0
          --volume "$PWD/cost aware pipeline/tests:/app/tests:ro"
          scientific-rag-ci:local
          python -m unittest discover -s tests/integration -t . -v

      - name: Start the production image for a smoke test
        run: |
          docker run --detach --name scientific-rag-smoke --network host \
            --env DATABASE_URL=postgresql+asyncpg://scientific_rag:ci_test_only@127.0.0.1:5432/scientific_rag \
            --env REDIS_URL=redis://127.0.0.1:6379/0 \
            --env APP_API_KEYS=admin:ci-test-access-key \
            --env APP_SESSION_SECRET=ci-test-session-secret-at-least-32-characters \
            scientific-rag-ci:local

      - name: Verify /healthz
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/healthz; then
              exit 0
            fi
            sleep 2
          done
          docker logs scientific-rag-smoke
          exit 1

      - name: Show smoke-test logs on failure
        if: failure()
        run: docker logs scientific-rag-smoke || true

      - name: Stop smoke-test container
        if: always()
        run: docker rm --force scientific-rag-smoke || true

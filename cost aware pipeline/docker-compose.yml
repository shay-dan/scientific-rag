services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://scientific_rag:${POSTGRES_PASSWORD}@db:5432/scientific_rag
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: arq app.worker.WorkerSettings
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://scientific_rag:${POSTGRES_PASSWORD}@db:5432/scientific_rag
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: scientific_rag
      POSTGRES_USER: scientific_rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scientific_rag -d scientific_rag"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://scientific_rag:scientific_rag@db:5432/scientific_rag
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: scientific_rag
      POSTGRES_USER: scientific_rag
      POSTGRES_PASSWORD: scientific_rag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scientific_rag -d scientific_rag"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

x-app-service: &app-service
  image: scientific-rag-app:local
  env_file:
    - .env
  environment:
    DATABASE_URL: postgresql+asyncpg://scientific_rag:${POSTGRES_PASSWORD}@db:5432/scientific_rag
    REDIS_URL: redis://redis:6379/0

services:
  migrate:
    <<: *app-service
    build: .
    command: alembic upgrade head
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app-service
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app-service
    command: arq app.worker.WorkerSettings
    healthcheck:
      # Check the heartbeat written by the running worker instead of importing
      # the full application a second time inside every health probe.
      test: ["CMD", "python", "-c", "import os, sys, redis; sys.exit(0 if redis.Redis.from_url(os.environ['REDIS_URL']).get('scientific_rag:worker:heartbeat') else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: scientific_rag
      POSTGRES_USER: scientific_rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scientific_rag -d scientific_rag"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
